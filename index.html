<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const target = document.querySelector("#poster-target");
        const video = document.querySelector("#ghost-video");
        target.addEventListener("targetFound", function () { video.play(); });
        target.addEventListener("targetLost", function () { video.pause(); });
        document.addEventListener("click", function () { video.play(); });
      });
    </script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="ghost-video" src="./ghost.mp4" loop muted playsinline preload="auto"></video>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="poster-target" mindar-image-target="targetIndex: 0">
        <a-video src="#ghost-video" position="0 0 0" width="1" height="0.5625"></a-video>
      </a-entity>
    </a-scene>
  </body>
</html>
